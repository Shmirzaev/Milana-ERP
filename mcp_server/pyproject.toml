[project]
name = "milana-erp-mcp"
version = "0.1.0"
description = "MCP server for safe Milana ERP GM assistant access"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.scripts]
milana-erp-mcp = "milana_erp_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
