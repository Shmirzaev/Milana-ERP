name: Purchasing approval cleanup diagnostics
on:
  workflow_dispatch:
  push:
    branches: ["codex/pg-cleanup-diagnostics-20261028"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Start owned loopback PostgreSQL
        run: |
          docker run --detach --cidfile "$RUNNER_TEMP/pur-diag.cid" --network host \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine \
            postgres -h 127.0.0.1 -p 55433
          for attempt in $(seq 1 30); do
            if docker exec "$(cat "$RUNNER_TEMP/pur-diag.cid")" pg_isready -h 127.0.0.1 -p 55433 -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: PostgreSQL held and closed connection controls
        id: controls
        continue-on-error: true
        env:
          PUR_APPROVAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:55433/postgres
        run: |
          mkdir -p "$RUNNER_TEMP/pur-diag-results"
          python backend/scripts/test_purchase_approval_cleanup_pg_control.py > "$RUNNER_TEMP/pur-diag-results/control.log" 2>&1
          cat "$RUNNER_TEMP/pur-diag-results/control.log"
      - name: Run three bounded independent owned-target diagnostics
        env:
          PUR_APPROVAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:55433/postgres
        run: |
          mkdir -p "$RUNNER_TEMP/pur-diag-results"
          failed=0
          if [ '${{ steps.controls.outcome }}' != 'success' ]; then failed=1; fi
          for run in 1 2 3; do
            set +e
            python backend/scripts/test_purchase_request_approval_postgres.py > "$RUNNER_TEMP/pur-diag-results/run-${run}.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNNER_TEMP/pur-diag-results/run-${run}.exit"
            cat "$RUNNER_TEMP/pur-diag-results/run-${run}.log"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pur-approval-cleanup-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/pur-diag-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only owned CI container
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pur-diag.cid" ]; then docker rm --force "$(cat "$RUNNER_TEMP/pur-diag.cid")"; fi
