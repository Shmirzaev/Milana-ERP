name: Build bundle handoff release artifacts
on:
  push:
    branches: [codex/bundle-handoff-publish-20261120]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 6ebfc7a31f1500e0699779b23266948f8638b50f
      BASE_SOURCE_SHA: e44d7930cae4c88aa51404ab1ac4759d03f2c5ce
      RELEASE_ID: '20261120_092044'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6ebfc7a31f1500e0699779b23266948f8638b50f
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Package exact immutable source
        run: python scripts/package_release.py --release "$RELEASE_ID" --output "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz"
      - name: Prepare build recipes
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          diff = subprocess.check_output([
              "git", "diff", "--name-status", "--no-renames",
              os.environ["BASE_SOURCE_SHA"], "HEAD", "--", "backend",
          ], text=True).splitlines()
          overlay = temp / "backend-overlay"
          for line in diff:
              status, name = line.split("\t", 1)
              source = Path(name)
              if status not in {"A", "M"} or not name.startswith("backend/app/"):
                  raise SystemExit(f"Cannot apply backend overlay: {line}")
              destination = overlay / source.relative_to("backend")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          (overlay / "Dockerfile").write_text(
              "FROM ghcr.io/shmirzaev/milana-erp-backend@sha256:db36b617873cf9bddd379fb69095c08fa5377fa5f7d98f3afced5439f3580c68\n"
              "COPY --chown=appuser:appuser app/ /app/app/\n"
          )

          source = Path("frontend/Dockerfile").read_text()
          if source.count("RUN npm run build") != 1:
              raise SystemExit("Unexpected frontend build recipe")
          (temp / "frontend.Dockerfile").write_text(
              source.replace("RUN npm run build", "RUN node node_modules/next/dist/bin/next build")
          )
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend on the verified live base
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/backend-overlay
          file: ${{ runner.temp }}/backend-overlay/Dockerfile
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-backend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/frontend.Dockerfile
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-frontend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://erp.milanapremium.uz
            API_URL=http://172.16.10.4:8000
          cache-from: type=gha,scope=security-frontend-v1
      - name: Bind source manifest and image digests
        env:
          BACKEND_IMAGE: ghcr.io/shmirzaev/milana-erp-backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/shmirzaev/milana-erp-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cp "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz.json" .
          GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_release_manifest.py
          cp deployment.json "$RUNNER_TEMP/deployment.json"
          echo 'Build-only publication requested by the owner. No additional test suites run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-handoff-release-20261120_092044
          path: |
            ${{ runner.temp }}/milana-erp-20261120_092044.tar.gz*
            ${{ runner.temp }}/deployment.json
