name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend/app
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run Bandit
        working-directory: backend
        run: python -m bandit -r app -x app/tests -q
      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt
      - name: Ruff critical lint
        working-directory: backend
        run: python -m ruff check app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm exec tsc -- --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
