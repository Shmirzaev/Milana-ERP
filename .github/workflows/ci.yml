name: ERP validation and immutable release artifacts

on:
  pull_request:
  push:
    branches:
      - main
      - clone_main
      # Worktree pushes validate on hosted runners; QA runtime authorization stays exact.
      - codex/**
      - '!codex/ceo-collapse-publish-20261120'
      - codex/ismail-finance-pilot-20261025
      - codex/ismail-brand-feedback-20261028
      - codex/ismail-combined-review-20261028
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      security_scan_only:
        description: "Run only the security gate; never publish release artifacts"
        type: boolean
        default: false
      security_scan_ref:
        description: "Source ref for security-only evidence (ignored for releases)"
        type: string
        default: clone_main
      release_id:
        description: "UTC release ID (YYYYMMDD_HHMMSS)"
        required: true
        type: string
      production_base_release:
        description: "Currently active production release"
        required: true
        type: string
      production_base_manifest:
        description: "Currently active SOURCE_MANIFEST.sha256 hash"
        required: true
        type: string

# Only PRs share a group; even pending main/clone_main pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      release: ${{ steps.plan.outputs.release }}
      base_release: ${{ steps.plan.outputs.base_release }}
      base_manifest: ${{ steps.plan.outputs.base_manifest }}
    steps:
      - uses: actions/checkout@v7
      - name: Select immutable candidate identity
        id: plan
        env:
          AUTO_RELEASE_BUILDS: ${{ vars.AUTO_RELEASE_BUILDS }}
          SECURITY_ONLY: ${{ inputs.security_scan_only }}
          INPUT_RELEASE: ${{ inputs.release_id }}
          INPUT_BASE_RELEASE: ${{ inputs.production_base_release }}
          INPUT_BASE_MANIFEST: ${{ inputs.production_base_manifest }}
        run: python scripts/release_ci_identity.py
  security-scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
      - name: Read PR changed paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/security-changed.txt"
      - name: Select security events
        id: scope
        run: |
          touch "$RUNNER_TEMP/security-changed.txt"
          python scripts/security_gate.py --scope --changed-files "$RUNNER_TEMP/security-changed.txt"
  security-scan:
    needs: [security-scope, release-plan]
    if: needs.security-scope.outputs.required == 'true'
    uses: ./.github/workflows/security-scan.yml
    with:
      source_ref: ${{ github.event_name == 'schedule' && 'clone_main' || github.event_name == 'workflow_dispatch' && inputs.security_scan_only && inputs.security_scan_ref || github.sha }}
      release_images: ${{ needs.release-plan.outputs.enabled == 'true' }}
  backend-bootstrap:
    name: Backend / bootstrap and policy
    if: &backend_validation github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.security_scan_only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - &backend_checkout
        uses: actions/checkout@v7
      - &backend_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - &backend_install
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Check CI trigger and cancellation policy
        run: python scripts/test_ci_trigger_policy.py
      - name: Check backend shard coverage verification
        run: python scripts/test_backend_regression_shard.py
      - &backend_start_pg
        name: Start job-owned loopback PostgreSQL 16
        run: |
          docker run --detach --cidfile "$RUNNER_TEMP/ci-postgres.cid" --name milana-ci-postgres \
            --network host --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=first_grade_qa_ci postgres:16-alpine \
            postgres -h 127.0.0.1 -p 5432
          for attempt in $(seq 1 30); do
            if docker exec milana-ci-postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify one Alembic head
        working-directory: backend
        run: python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads=ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); assert len(heads)==1, heads; print(heads[0])"
      - name: Rehearse fresh and both ECO/turnstile migration histories
        working-directory: backend
        env:
          MIGRATION_REHEARSAL_ADMIN_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/postgres
        run: python scripts/verify_eco_gate_migration_merge.py
      - name: Security gate policy and workflow regressions
        run: python -m unittest discover -s scripts -p 'test_security_gate.py' -v
      - name: Ruff and compile
        working-directory: backend
        run: |
          python -m ruff check app
          python -m compileall -q app scripts
      - name: Worker metadata ownership and lifespan regressions
        run: python -m pytest -q backend/app/tests/test_runtime_metadata.py backend/app/tests/test_startup_schema.py backend/app/tests/test_json_response_thread.py
      - name: Automatic release trust, drift and recovery regressions
        run: python -m unittest discover -s scripts -p 'test_auto_release*.py' -v
      - name: Deployment observation regression suite
        run: python -m unittest discover -s scripts -p 'test_observe_release.py' -v
      - &backend_stop_pg
        name: Remove only this job's owned PostgreSQL container
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ci-postgres.cid" ]; then
            docker rm --force "$(cat "$RUNNER_TEMP/ci-postgres.cid")"
          fi

  backend-operations:
    name: Backend / PostgreSQL operations
    if: *backend_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *backend_checkout
      - *backend_python
      - *backend_install
      - *backend_start_pg
      - name: Stabilization PostgreSQL auth and rate races
        working-directory: backend
        env:
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: >-
          python -m pytest -v -rs
          app/tests/test_password_change_races.py::test_postgres_same_current_password_changes_only_once
          app/tests/test_rate_limit_scheduling.py::test_postgres_roster_lock_survives_concurrent_rate_store_workers
      - name: Planning cutting factory PostgreSQL routing and stale-scope races
        working-directory: backend
        env:
          PLANNING_CUTTING_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: python -m pytest -q app/tests/test_planning_cutting_factory_postgres.py app/tests/test_packaging_report_page_postgres.py
      - name: BST handoff PostgreSQL preservation and recovery
        env:
          PYTHONPATH: ./backend
          BST_HANDOFF_TEST_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/bst_handoff_test
        run: |
          docker exec milana-ci-postgres createdb -U postgres bst_handoff_test
          trap 'docker exec milana-ci-postgres dropdb -U postgres bst_handoff_test' EXIT
          python -m pytest -q backend/tests/test_bst_master_handoff_postgres.py
      - name: ECO material PostgreSQL migration and concurrency
        working-directory: backend
        env:
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: python -m pytest -q app/tests/test_eco_inventory_postgres.py
      - name: Combined Cutting rejection, Qolip CAD and passport allocation PostgreSQL regressions
        working-directory: backend
        env:
          PLANNING_CUTTING_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
          PASSPORT_ALLOCATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: >-
          python -m pytest -q
          app/tests/test_cutting_order_rejection_postgres.py
          app/tests/test_model_pattern_cad_postgres.py
          app/tests/test_passport_batch_allocations_postgres.py
      - name: Purchasing approval PostgreSQL write boundary
        env:
          PUR_APPROVAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: python backend/scripts/test_purchase_request_approval_postgres.py
      - name: Purchasing approval cleanup controls
        env:
          PUR_APPROVAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: python backend/scripts/purchase_approval_cleanup_pg_control.py
      - name: Create disposable Sales list review database
        id: sales-list-db
        run: >-
          python -c "import psycopg2; db=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',dbname='postgres'); db.autocommit=True; db.cursor().execute('CREATE DATABASE review_sales_list_ci'); db.close()"
      - name: Sales list quantities and bounded PostgreSQL queries
        working-directory: backend
        env:
          SALES_LIST_REVIEW_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/review_sales_list_ci
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/review_sales_list_ci
        run: python -m pytest -q app/tests/test_sales_list_truth.py app/tests/test_sales_list_query_growth.py
      - name: Drop owned Sales list review database
        if: ${{ always() && steps.sales-list-db.outcome == 'success' }}
        run: >-
          python -c "import psycopg2; db=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',dbname='postgres'); db.autocommit=True; db.cursor().execute('DROP DATABASE review_sales_list_ci WITH (FORCE)'); db.close()"
      - name: Create disposable Forecast creation review database
        id: forecast-create-db
        run: >-
          python -c "import psycopg2; db=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',dbname='postgres'); db.autocommit=True; db.cursor().execute('CREATE DATABASE review_forecast_create_ci'); db.close()"
      - name: Forecast creation PostgreSQL atomicity
        working-directory: backend
        env:
          FORECAST_CREATE_REVIEW_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/review_forecast_create_ci
        run: python -m pytest -q app/tests/test_forecast_create_postgres.py
      - name: Drop owned Forecast creation review database
        if: ${{ always() && steps.forecast-create-db.outcome == 'success' }}
        run: >-
          python -c "import psycopg2; db=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',dbname='postgres'); db.autocommit=True; db.cursor().execute('DROP DATABASE review_forecast_create_ci WITH (FORCE)'); db.close()"
      - *backend_stop_pg

  backend-locking:
    name: Backend / PostgreSQL locking
    if: *backend_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *backend_checkout
      - *backend_python
      - *backend_install
      - *backend_start_pg
      - name: P2 PostgreSQL locking and query-plan regressions
        env:
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: >-
          python -m pytest -q
          backend/app/tests/test_admin_membership_delete_race.py
          backend/app/tests/test_process_qr_model_operations.py
          backend/app/tests/test_numbering_postgres_concurrency.py
          backend/app/tests/test_material_reservation_concurrency.py
          backend/app/tests/test_package_write_postgres.py
          backend/app/tests/test_package_batch_receive_concurrency.py
          backend/app/tests/test_cutting_packaging_write_postgres.py
          backend/app/tests/test_cutting_reconciliation_postgres.py
          backend/app/tests/test_cutting_batch_lifecycle_postgres.py
          backend/app/tests/test_traceability_postgres_plan.py
          backend/app/tests/test_packaging_receive_options_query_growth.py
          backend/app/tests/test_warehouse_pack_reservations_postgres.py
          backend/app/tests/test_sewing_band_postgres.py
          backend/app/tests/test_direct_packaging_postgres.py
          backend/app/tests/test_sewing_packaging_lock_postgres.py
          backend/app/tests/test_sewing_daily_report_lock_order.py
          backend/app/tests/test_sewing_later_nastil_postgres.py
          backend/app/tests/test_nastil_factory_postgres.py
          backend/app/tests/test_open_shipment_allocations_postgres.py
          backend/app/tests/test_besttex_cutting_postgres.py
          backend/app/tests/test_payroll_overlap_repair.py
          backend/app/tests/test_payroll_split_correction_races.py
          backend/app/tests/test_payroll_returned_split_races.py
          backend/app/tests/test_manual_packaging_postgres.py
          backend/app/tests/test_payroll_qr_return_races.py
          backend/app/tests/test_payroll_period_races.py
      - name: Catalog group paging and variant creation on an approved PostgreSQL instance
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import psycopg2, pytest
          cid = (Path(os.environ['RUNNER_TEMP']) / 'ci-postgres.cid').read_text().strip()
          container = json.loads(subprocess.check_output(['docker', 'inspect', cid]))[0]
          assert container['Id'] == cid and container['State']['Running']
          assert container['HostConfig']['NetworkMode'] == 'host'
          with psycopg2.connect(host='127.0.0.1', port=5432, user='postgres', dbname='postgres') as db:
              with db.cursor() as cursor:
                  cursor.execute("SELECT host(inet_server_addr()), inet_server_port(), current_setting('server_version'), (SELECT system_identifier::text FROM pg_control_system()), current_setting('data_directory')")
                  host, port, version, identifier, directory = cursor.fetchone()
          owned_identifier = subprocess.check_output(['docker', 'exec', cid, 'psql', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres', '-Atc', 'SELECT system_identifier FROM pg_control_system()'], text=True).strip()
          assert host == '127.0.0.1' and port == 5432 and identifier == owned_identifier
          os.environ['MILANA_TEST_PG_INSTANCE'] = json.dumps({'admin_dsn': 'postgresql+psycopg2://postgres@127.0.0.1:5432/postgres', 'host': host, 'port': port, 'server_version': version, 'system_identifier': identifier, 'data_directory': directory, 'target_prefix': 'ci_group_page_'})
          os.environ['MILANA_REQUIRE_TEST_PG'] = '1'
          raise SystemExit(pytest.main(['-q', '--junitxml=' + os.environ['RUNNER_TEMP'] + '/catalog-group-variant.xml', 'backend/app/tests/test_model_group_page_postgres.py', 'backend/app/tests/test_model_options_numeric_postgres.py', 'backend/app/tests/test_variant_create_postgres.py']))
          PY
      - *backend_stop_pg

  backend-schema:
    name: Backend / schema and reservations
    if: *backend_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *backend_checkout
      - *backend_python
      - *backend_install
      - *backend_start_pg
      - name: Ismail PostgreSQL schema and reservation regressions
        working-directory: backend
        env:
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
        run: >-
          python -m pytest -q app/tests/test_fresh_migration_bootstrap.py
          app/tests/test_ismail_schema_completion.py app/tests/test_migration_preflight.py
          app/tests/test_db08_beyka_orm_parity.py app/tests/test_reservation_overclaim.py
          app/tests/test_reservation_plan_query_growth.py
          app/tests/test_stock_movement_batch_integrity.py
      - name: PostgreSQL migration, concurrency and model numbering regression
        env:
          PYTHONPATH: ./backend
          FIRST_GRADE_DISPOSABLE: "1"
          DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/first_grade_qa_ci
          JWT_SECRET: disposable-local-test-secret-only
          FILE_SIGNING_SECRET: disposable-local-file-signing-secret-only
          INITIAL_ADMIN_EMAIL: admin@disposable.invalid
          INITIAL_ADMIN_PASSWORD: disposable-local-test-password-123!
          SEED_DEMO_USERS: "false"
          SEED_SAMPLE_DATA: "true"
          IMPORT_LEGACY_MODELS: "false"
          BARCODE_STORAGE_DIR: /tmp/first-grade-test-barcodes
        run: |
          python scripts/test_first_grade_postgres.py
          python scripts/test_model_numbering_postgres.py
      - *backend_stop_pg

  backend-regression:
    name: Backend / regression ${{ matrix.shard }}
    if: *backend_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - *backend_checkout
      - *backend_python
      - *backend_install
      - *backend_start_pg
      - name: Run backend regression shard
        working-directory: backend
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: >
          python ../scripts/run_backend_regression_shard.py run
          --index "$SHARD_INDEX" --count 8 --manifest "$RUNNER_TEMP/backend-shard.json"
      - name: Upload tested shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-shard.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - *backend_stop_pg

  backend:
    needs: [backend-bootstrap, backend-operations, backend-locking, backend-schema, backend-regression]
    if: always() && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.security_scan_only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every backend job to pass
        env:
          BOOTSTRAP_RESULT: ${{ needs.backend-bootstrap.result }}
          OPERATIONS_RESULT: ${{ needs.backend-operations.result }}
          LOCKING_RESULT: ${{ needs.backend-locking.result }}
          SCHEMA_RESULT: ${{ needs.backend-schema.result }}
          REGRESSION_RESULT: ${{ needs.backend-regression.result }}
        run: |
          for result in "$BOOTSTRAP_RESULT" "$OPERATIONS_RESULT" "$LOCKING_RESULT" "$SCHEMA_RESULT" "$REGRESSION_RESULT"; do
            if [ "$result" != success ]; then
              printf 'Every backend job must succeed. Found %s.\n' "$result" >&2
              exit 1
            fi
          done
      - *backend_checkout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download coverage for all regression shards
        uses: actions/download-artifact@v4
        with:
          pattern: backend-regression-*
          path: ${{ runner.temp }}/backend-coverage
      - name: Verify regression coverage
        run: python scripts/run_backend_regression_shard.py verify --count 8 --directory "$RUNNER_TEMP/backend-coverage"

  frontend:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.security_scan_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --legacy-peer-deps
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck:strict
      - name: All node-only frontend tests (quarantines reported separately)
        working-directory: frontend
        timeout-minutes: 15
        env:
          TZ: UTC
          LANG: en_US.UTF-8
        run: node scripts/run-node-tests.mjs
      - name: Sales enum contracts and mutation checks
        working-directory: frontend
        run: npm run test:sales-enum-contracts
      - name: Browser pagination and Besttex label regressions
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:load-more-browser
          node scripts/test-process-qr-batch-groups.browser.mjs
          node scripts/test-warehouse-pack-lifecycle.browser.mjs
          node scripts/test-sewing-bands.browser.mjs
          node scripts/test-packaging-size-entry.browser.mjs
          node scripts/test-grade-packaging-state.browser.mjs
          node scripts/test-cutting-factory-salary.browser.mjs
          node scripts/test-cutting-batch-selection.browser.mjs
          node scripts/test-sewing-received-input.browser.mjs
          node scripts/test-sewing-later-nastil.browser.mjs
          node scripts/test-cutting-passport-reports.browser.mjs
          node scripts/test-passport-fabric-employee-export.browser.mjs
          node scripts/test-hr-employees-locales.browser.mjs
          node scripts/test-employee-archive.browser.mjs
          node scripts/test-cutting-batch-print.browser.mjs
          node scripts/test-receive-total-length.browser.mjs
          node scripts/check-receiving-auto-roll-weights.mjs
      - name: Optimized production build and contracts
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://erp.milanapremium.uz
          API_URL: http://172.16.10.4:8000
        run: npm run build
      - name: Clear generated production build for isolated QA build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        working-directory: frontend
        run: |
          test -d .next
          test ! -L .next
          rm -rf -- .next
      - name: Build loopback-only QA frontend
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        timeout-minutes: 5
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ''
          API_URL: http://127.0.0.1:8107
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -- --webpack
      - name: QA runtime manifest and smoke regressions
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        timeout-minutes: 2
        working-directory: frontend
        run: python3 -m unittest discover -s scripts -p 'test_*qa_runtime*.py' -v
      - name: Stage bounded QA frontend runtime
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        timeout-minutes: 2
        working-directory: frontend
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ''
          API_URL: http://127.0.0.1:8107
          NEXT_TELEMETRY_DISABLED: '1'
        run: python3 scripts/stage_qa_runtime.py
      - name: Smoke exact staged QA frontend archive
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        timeout-minutes: 2
        working-directory: frontend
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/smoke_qa_runtime.py
      - name: Upload QA-only frontend runtime
        id: qa_upload
        if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/ismail-finance-pilot-20261025' || github.ref == 'refs/heads/codex/ismail-brand-feedback-20261028' || github.ref == 'refs/heads/codex/ismail-combined-review-20261028')
        uses: actions/upload-artifact@v4
        with:
          name: qa-frontend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/finance-qa-runtime-${{ github.sha }}/runtime.zip
            ${{ runner.temp }}/finance-qa-runtime-${{ github.sha }}/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Report QA artifact identity
        if: steps.qa_upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.qa_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.qa_upload.outputs.artifact-digest }}
        run: |
          printf 'QA artifact id: %s\n' "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'QA artifact digest: %s\n' "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: needs.release-plan.outputs.enabled == 'true' && !inputs.security_scan_only
    needs: [release-plan, backend, frontend, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity and production base
        env:
          RELEASE_ID: ${{ needs.release-plan.outputs.release }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]{8}_[0-9]{6}(_[1-9][0-9]{0,19}_[1-9][0-9]{0,5})?$ ]]
          python scripts/verify_release_source.py . \
            --expected-base-release '${{ needs.release-plan.outputs.base_release }}' \
            --expected-base-manifest '${{ needs.release-plan.outputs.base_manifest }}'
      - name: Package deterministic source archive
        run: python scripts/package_release.py --release '${{ needs.release-plan.outputs.release }}' --output 'milana-erp-${{ needs.release-plan.outputs.release }}.tar.gz'
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Resolve image names
        id: images
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/$owner/milana-erp-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/milana-erp-frontend" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: scanned-release-images-${{ github.run_id }}
          path: ${{ runner.temp }}/scanned-images
      - name: Load and verify exact scanned images
        run: |
          docker load -i "$RUNNER_TEMP/scanned-images/images.tar"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          identity = json.loads(Path(os.environ['RUNNER_TEMP'], 'scanned-images', 'identity.json').read_text())
          assert identity['source_sha'] == os.environ['GITHUB_SHA']
          for kind, expected in identity['images'].items():
              actual = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', f'milana-security-{kind}:{os.environ["GITHUB_RUN_ID"]}'], text=True).strip()
              assert actual == expected, (kind, actual, expected)
          PY
      - name: Publish scanned backend image
        id: backend_image
        env:
          DESTINATION: ${{ steps.images.outputs.backend }}:${{ needs.release-plan.outputs.release }}
        run: |
          docker tag "milana-security-backend:$GITHUB_RUN_ID" "$DESTINATION"
          docker push "$DESTINATION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$DESTINATION")
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Verify rollback image strict schema-0150 startup and worker recovery
        if: hashFiles('scripts/test_rollback_image_schema_0150.py') != '' && hashFiles('backend/app/models/fulfillment/package_customer_service.py') == ''
        timeout-minutes: 12
        env:
          ROLLBACK_BACKEND_IMAGE: ${{ steps.images.outputs.backend }}@${{ steps.backend_image.outputs.digest }}
          ROLLBACK_SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/test_rollback_image_schema_0150.py --image "$ROLLBACK_BACKEND_IMAGE" --revision "$ROLLBACK_SOURCE_REVISION"
      - name: Publish scanned frontend image
        id: frontend_image
        env:
          DESTINATION: ${{ steps.images.outputs.frontend }}:${{ needs.release-plan.outputs.release }}
        run: |
          docker tag "milana-security-frontend:$GITHUB_RUN_ID" "$DESTINATION"
          docker push "$DESTINATION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$DESTINATION")
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Pin deployment manifest to validated source and published digests
        env:
          RELEASE_ID: ${{ needs.release-plan.outputs.release }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}@${{ steps.backend_image.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}@${{ steps.frontend_image.outputs.digest }}
        run: python scripts/prepare_release_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: milana-erp-${{ needs.release-plan.outputs.release }}
          path: |
            milana-erp-${{ needs.release-plan.outputs.release }}.tar.gz
            milana-erp-${{ needs.release-plan.outputs.release }}.tar.gz.json
            deployment.json
          if-no-files-found: error
          retention-days: 90
      - name: Report artifacts ready
        env:
          RELEASE_ID: ${{ needs.release-plan.outputs.release }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}@${{ steps.backend_image.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}@${{ steps.frontend_image.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = os.environ["RELEASE_ID"]
          metadata = json.loads(Path(f"milana-erp-{release}.tar.gz.json").read_text())
          assert metadata["git_commit"] == os.environ["GITHUB_SHA"]
          summary = "\n".join([
              "## Artifacts ready — production activation pending",
              "",
              f"Release: `{release}`",
              f"Source commit: `{metadata['git_commit']}`",
              f"Source manifest: `{metadata['source_manifest_sha256']}`",
              f"Backend: `{os.environ['BACKEND_IMAGE']}`",
              f"Frontend: `{os.environ['FRONTEND_IMAGE']}`",
              "",
              "Backend/frontend validation passed and immutable artifacts were published.",
              "This workflow does not activate production. The installed LAN worker prepares eligible branch candidates.",
              "Wait for Milana / production: Ready to deploy before merging the exact candidate into clone_main.",
              "Follow DEPLOYMENT.md for source rechecks, backup, staging, QA and cutover.",
              "Report Live only after both roles and postflight pass; report Observation complete",
              "only after the reviewed 10-minute low-risk or 30-minute high-risk window",
              "and successful closing checks. Uncertain risk defaults to 30 minutes.",
              "",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY
