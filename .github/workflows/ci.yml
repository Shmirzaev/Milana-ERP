name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend/app
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=50 -q
      - name: Run Bandit
        working-directory: backend
        run: python -m bandit -r app -x app/tests -q
      - name: Audit Python dependencies
        working-directory: backend
        # python-jose installs ecdsa transitively. PYSEC-2026-1325 has no fixed
        # release, and production/public startup rejects every JWT algorithm
        # except HS256, so the vulnerable elliptic-curve path is unreachable.
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: Ruff critical lint
        working-directory: backend
        run: python -m ruff check app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check translations
        working-directory: frontend
        run: npm run check:i18n
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Focused strict typecheck
        working-directory: frontend
        run: npm run typecheck:strict
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npm run build
