name: Refactor operation PostgreSQL gate

on:
  pull_request:
  push:
    branches: [main, clone_main]
  workflow_dispatch:

# Only PRs share a group; even pending main/clone_main pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  refactor-operation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Check CI trigger and cancellation policy
        run: python scripts/test_ci_trigger_policy.py
      - name: Verify PostgreSQL gate evidence and environment guards
        run: python scripts/test_refactor_pg_gate.py
      - name: Start this job's loopback-only PostgreSQL
        run: |
          docker run --detach --name milana-refactor-pg --network host \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine \
            postgres -h 127.0.0.1 -p 55432
          for attempt in $(seq 1 30); do
            if docker exec milana-refactor-pg pg_isready -h 127.0.0.1 -p 55432 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Record container identity independently of the target connection
        run: |
          docker exec milana-refactor-pg psql -U postgres -h 127.0.0.1 -p 55432 -d postgres -At \
            -c "SELECT json_build_object('server_version', current_setting('server_version'), 'system_identifier', (SELECT system_identifier::text FROM pg_control_system()), 'data_directory', current_setting('data_directory'))" \
            > "$RUNNER_TEMP/refactor-pg-identity.json"
          python scripts/run_refactor_pg_gate.py \
            --ci-identity "$RUNNER_TEMP/refactor-pg-identity.json" --github-env "$GITHUB_ENV"
      - name: Run every required operation case; fail skipped or missing evidence
        run: python scripts/run_refactor_pg_gate.py --report "$RUNNER_TEMP/refactor-pg-gate.xml"
      - name: Run isolated Purchasing and Fabric PG cases; fail skipped or missing evidence
        run: >-
          python scripts/run_refactor_pg_supplement_gate.py
          --report "$RUNNER_TEMP/purchasing-fabric-pg-gate.xml"
      - name: Verify shared RF004 contracts on SQLite and approved PostgreSQL
        env:
          STABILIZATION_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:55432/postgres
        run: |
          python -m pytest -q backend/app/tests/test_rf004_audit_read_characterization.py backend/app/tests/test_audit_chain_concurrency.py backend/app/tests/test_shipment_reopen_idempotency_characterization.py backend/app/tests/test_idempotency_identity.py backend/app/tests/test_readiness_operation_characterization.py scripts/test_refactor_pg_evidence_characterization.py scripts/test_run_local_postgres_tests.py backend/tests/test_refactor_boundary_audit.py --junitxml="$RUNNER_TEMP/rf004-runner-contracts.xml"
          python - "$RUNNER_TEMP/rf004-runner-contracts.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          assert cases and all(not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")) for case in cases)
          assert any("[sqlite]" in case.get("name", "") for case in cases)
          assert any("[postgres]" in case.get("name", "") for case in cases)
          PY
      - name: Preserve exact test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-operation-postgres-report
          path: |
            ${{ runner.temp }}/refactor-pg-gate.xml
            ${{ runner.temp }}/purchasing-fabric-pg-gate.xml
            ${{ runner.temp }}/rf004-runner-contracts.xml
          if-no-files-found: warn
      - name: Remove only this job's owned container
        if: always()
        run: docker rm --force milana-refactor-pg
