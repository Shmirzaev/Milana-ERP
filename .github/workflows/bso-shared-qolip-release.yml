name: Build shared BSO qolip release
on:
  push:
    branches: [release/bso-shared-qolip-20261121-092525]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 1770f06252d873f64c237fdd9041533472f9151e
      BASE_SOURCE_SHA: acbb3d5a67dec27d56e859c1a30220c9e83bb160
      RELEASE_ID: '20261121_092525'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1770f06252d873f64c237fdd9041533472f9151e
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Package reviewed source and prepare image overlays
        run: |
          python scripts/package_release.py --release "$RELEASE_ID" --output "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz"
          git diff --exit-code "$BASE_SOURCE_SHA" "$SOURCE_SHA" -- frontend backend/alembic backend/Dockerfile backend/requirements.txt
          path=app/models/production/branded_pattern_service.py
          changed_code=$(git diff --name-only "$BASE_SOURCE_SHA" "$SOURCE_SHA" -- backend/app ':!backend/app/tests' ':!backend/app/models/planning/README.md')
          test "$changed_code" = "backend/$path"
          overlay="$RUNNER_TEMP/bso-backend"
          install -D "backend/$path" "$overlay/$path"
          cat > "$overlay/Dockerfile" <<'DOCKERFILE'
          FROM ghcr.io/shmirzaev/milana-erp-backend@sha256:5d3c63c34f3d93471ce2dca203d61e8b11f52d829bb09d8bf1d566793f043740
          COPY --chown=appuser:appuser app/ /app/app/
          DOCKERFILE
          mkdir "$RUNNER_TEMP/bso-frontend"
          cat > "$RUNNER_TEMP/bso-frontend/Dockerfile" <<'DOCKERFILE'
          FROM ghcr.io/shmirzaev/milana-erp-frontend@sha256:c5750fdf8148d30a8a64cf0720ce52bba1fe6bdf8104fc29462f5668bbcfca2f
          DOCKERFILE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/bso-backend
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-backend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Publish unchanged frontend layers for this release
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/bso-frontend
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-frontend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Bind source and image digests
        env:
          BACKEND_IMAGE: ghcr.io/shmirzaev/milana-erp-backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/shmirzaev/milana-erp-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cp "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz.json" .
          GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_release_manifest.py
          cp deployment.json "$RUNNER_TEMP/deployment.json"
          echo 'Build only at owner request. Test suites were skipped.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bso-shared-qolip-release
          path: |
            ${{ runner.temp }}/milana-erp-20261121_092525.tar.gz*
            ${{ runner.temp }}/deployment.json
