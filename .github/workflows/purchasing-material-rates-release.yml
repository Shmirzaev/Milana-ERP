name: Build purchasing material rates release
on:
  push:
    branches: [release/purchasing-material-rates-20261121-083559]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 16fe127e39b6a67e07b324bc8bf9313d5f5a0b28
      BASE_SOURCE_SHA: e0649666abb5f018c5e70cc98447820a8d8c93e1
      RELEASE_ID: '20261121_083559'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 16fe127e39b6a67e07b324bc8bf9313d5f5a0b28
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Package reviewed source and prepare build recipes
        run: |
          python scripts/package_release.py --release "$RELEASE_ID" --output "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz"
          git diff --exit-code "$BASE_SOURCE_SHA" "$SOURCE_SHA" -- backend/alembic backend/Dockerfile backend/requirements.txt
          dto=app/libs/dto/planning/price_calculation_request_update.py
          overlay="$RUNNER_TEMP/purchasing-backend"
          mkdir -p "$overlay/$(dirname "$dto")"
          cp "backend/$dto" "$overlay/$dto"
          cat > "$overlay/Dockerfile" <<'DOCKERFILE'
          FROM ghcr.io/shmirzaev/milana-erp-backend@sha256:e9dda77f67ecbce9c889b32e78259a958ad8199521ae46d6cc70ce41b2f0252c
          COPY --chown=appuser:appuser app/ /app/app/
          DOCKERFILE
          grep -Fxq 'RUN npm run build' frontend/Dockerfile
          sed 's/^RUN npm run build$/RUN .\/node_modules\/\.bin\/next build/' frontend/Dockerfile > "$RUNNER_TEMP/purchasing-frontend.Dockerfile"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/purchasing-backend
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-backend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/purchasing-frontend.Dockerfile
          push: true
          tags: ghcr.io/shmirzaev/milana-erp-frontend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: NEXT_PUBLIC_API_URL=https://erp.milanapremium.uz
          cache-from: type=gha,scope=security-frontend-v1
      - name: Bind source and image digests
        env:
          BACKEND_IMAGE: ghcr.io/shmirzaev/milana-erp-backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/shmirzaev/milana-erp-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cp "$RUNNER_TEMP/milana-erp-$RELEASE_ID.tar.gz.json" .
          GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_release_manifest.py
          cp deployment.json "$RUNNER_TEMP/deployment.json"
          echo 'Build only at owner request. Automated tests were skipped.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: purchasing-material-rates-release
          path: |
            ${{ runner.temp }}/milana-erp-20261121_083559.tar.gz*
            ${{ runner.temp }}/deployment.json
