# Test-only intended NPM/Nginx TLS edge; exact live NPM configuration is unknown.
events {}
http {
  access_log off;
  server {
    listen 18443 ssl;
    ssl_certificate /fixture/tls/cert.pem;
    ssl_certificate_key /fixture/tls/key.pem;
    # Independent test observation of the edge socket peer, not an application input.
    add_header X-Acceptance-Edge-Client $remote_addr always;
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
