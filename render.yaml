databases:
  - name: milana-erp-db
    databaseName: milana_erp
    user: milana_erp

services:
  - type: web
    name: milana-erp-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: milana-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: APP_NAME
        value: Milana ERP
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: BARCODE_STORAGE_DIR
        value: /opt/render/project/src/backend/storage/barcodes

  - type: web
    name: milana-erp-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: milana-erp-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_ENV
        value: production
