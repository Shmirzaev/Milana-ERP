[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "node_modules",
  ".next",
  ".tmp",
]

[tool.ruff.lint]
# Start with runtime and import hazards. Broaden this after the legacy style
# debt is repaired independently from production behavior changes.
select = ["E9", "F401", "F63", "F7", "F82"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["backend"]

[tool.coverage.run]
source = ["backend/app"]
omit = [
  "backend/app/tests/*",
  "backend/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50

[tool.bandit]
exclude_dirs = ["backend/app/tests", ".tmp"]
skips = ["B101"]
