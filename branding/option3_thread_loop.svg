<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — thread loop">
  <title>Milana ERP — thread loop</title>
  <defs>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="loopAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <!-- continuous thread loop — figure-8 / infinity shape suggesting closed lifecycle -->
    <circle cx="90" cy="90" r="86" fill="#ECFDF5"/>
    <circle cx="90" cy="90" r="86" fill="none" stroke="url(#loopGrad)" stroke-width="3"/>

    <!-- needle: angled line through the loop -->
    <line x1="36" y1="144" x2="148" y2="32"
          stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <!-- needle eye -->
    <circle cx="42" cy="138" r="6" fill="none" stroke="#0F172A" stroke-width="3"/>
    <!-- needle tip dot -->
    <circle cx="150" cy="30" r="4" fill="#0F172A"/>

    <!-- thread coming through the eye, looping -->
    <path d="M48,132 C20,110 30,70 70,76 C110,82 130,120 100,150"
          fill="none" stroke="url(#loopAccent)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- thread stitch dots -->
    <circle cx="70"  cy="76"  r="4" fill="url(#loopAccent)"/>
    <circle cx="100" cy="150" r="4" fill="url(#loopAccent)"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0F172A">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#475569">THREAD&#8201;·&#8201;ERP&#8201;OS</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#loopGrad)"/>
  </g>
</svg>
