<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — hex circular flow">
  <title>Milana ERP — hex circular flow</title>
  <defs>
    <linearGradient id="h2bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="h2bAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46" fill="url(#h2bGrad)"/>
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46"
             fill="none" stroke="#334155" stroke-width="2"/>

    <!-- circular workflow ring around the center -->
    <circle cx="90" cy="90" r="50" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3 5"/>

    <!-- six nodes around the circle -->
    <g>
      <circle cx="90"  cy="40"  r="9" fill="url(#h2bAccent)"/>
      <circle cx="133" cy="65"  r="9" fill="#CBD5E1"/>
      <circle cx="133" cy="115" r="9" fill="#CBD5E1"/>
      <circle cx="90"  cy="140" r="9" fill="#CBD5E1"/>
      <circle cx="47"  cy="115" r="9" fill="#CBD5E1"/>
      <circle cx="47"  cy="65"  r="9" fill="url(#h2bAccent)"/>
    </g>

    <!-- center node -->
    <circle cx="90" cy="90" r="11" fill="#ffffff"/>
    <circle cx="90" cy="90" r="5"  fill="url(#h2bAccent)"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0F172A">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#64748B">FLOW&#8201;·&#8201;ERP</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#h2bAccent)"/>
  </g>
</svg>
