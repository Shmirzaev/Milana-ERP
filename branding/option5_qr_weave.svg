<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — QR weave">
  <title>Milana ERP — QR weave</title>
  <defs>
    <linearGradient id="qrGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <!-- backdrop -->
    <rect x="0" y="0" width="180" height="180" rx="20" fill="#0B1220"/>

    <!-- QR-style finder squares — bundle/package barcode reference -->
    <g fill="none" stroke="url(#qrGrad)" stroke-width="6">
      <rect x="22"  y="22"  width="44" height="44" rx="6"/>
      <rect x="114" y="22"  width="44" height="44" rx="6"/>
      <rect x="22"  y="114" width="44" height="44" rx="6"/>
    </g>
    <g fill="url(#qrGrad)">
      <rect x="36"  y="36"  width="16" height="16" rx="2"/>
      <rect x="128" y="36"  width="16" height="16" rx="2"/>
      <rect x="36"  y="128" width="16" height="16" rx="2"/>
    </g>

    <!-- woven thread pattern in the open quadrant -->
    <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round">
      <line x1="92"  y1="100" x2="160" y2="100"/>
      <line x1="92"  y1="120" x2="160" y2="120"/>
      <line x1="92"  y1="140" x2="160" y2="140"/>
    </g>
    <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55">
      <line x1="100" y1="92"  x2="100" y2="160"/>
      <line x1="120" y1="92"  x2="120" y2="160"/>
      <line x1="140" y1="92"  x2="140" y2="160"/>
    </g>

    <!-- center dot -->
    <circle cx="92" cy="92" r="5" fill="#F8FAFC"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0B1220">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#475569">TRACE&#8201;·&#8201;ERP</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#qrGrad)"/>
  </g>
</svg>
