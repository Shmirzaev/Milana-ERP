<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP logo">
  <title>Milana ERP</title>
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square containing an angular M with a stitched accent -->
  <g transform="translate(20,20)">
    <!-- backdrop tile -->
    <rect x="0" y="0" width="180" height="180" rx="36" ry="36" fill="url(#markGrad)"/>

    <!-- subtle inner ring suggesting a node -->
    <rect x="14" y="14" width="152" height="152" rx="28" ry="28"
          fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

    <!-- angular M: needle path / workflow polyline -->
    <polyline points="38,140 38,52 90,108 142,52 142,140"
              fill="none" stroke="#ffffff" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- stitched accent — three dots along the seam, in teal -->
    <circle cx="38"  cy="52"  r="7" fill="url(#accentGrad)"/>
    <circle cx="90"  cy="108" r="7" fill="url(#accentGrad)"/>
    <circle cx="142" cy="52"  r="7" fill="url(#accentGrad)"/>

    <!-- needle tip notch at top-right corner of M -->
    <path d="M142,140 L154,152" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#111827">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#6B7280">ERP&#8201;·&#8201;GARMENT&#8201;OS</text>
    <!-- thin accent underline -->
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#accentGrad)"/>
  </g>
</svg>
