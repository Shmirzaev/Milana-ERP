<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — hex six-stage">
  <title>Milana ERP — hex six-stage</title>
  <defs>
    <linearGradient id="h2aGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="h2aAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46" fill="url(#h2aGrad)"/>
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46"
             fill="none" stroke="#334155" stroke-width="2"/>

    <!-- six pipeline nodes arranged around the hex center, mirroring the real flow:
         Sales → Cut → Sew → Pack → FG → Ship -->
    <line x1="36" y1="54"  x2="144" y2="54"  stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="36" y1="126" x2="144" y2="126" stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="90" y1="54"  x2="90"  y2="126" stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>

    <circle cx="36"  cy="54"  r="9" fill="url(#h2aAccent)"/>
    <circle cx="90"  cy="54"  r="9" fill="#CBD5E1"/>
    <circle cx="144" cy="54"  r="9" fill="#CBD5E1"/>
    <circle cx="144" cy="126" r="9" fill="#CBD5E1"/>
    <circle cx="90"  cy="126" r="9" fill="#CBD5E1"/>
    <circle cx="36"  cy="126" r="9" fill="url(#h2aAccent)"/>

    <!-- subtle directional arrow at the end -->
    <path d="M30,126 L22,120 L22,132 Z" fill="url(#h2aAccent)"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0F172A">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#64748B">6&#8201;·&#8201;STAGE&#8201;ERP</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#h2aAccent)"/>
  </g>
</svg>
