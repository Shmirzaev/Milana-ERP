<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — hex pipeline">
  <title>Milana ERP — hex pipeline</title>
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hexAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <!-- hexagonal tile -->
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46"
             fill="url(#hexGrad)"/>
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46"
             fill="none" stroke="#334155" stroke-width="2"/>

    <!-- pipeline nodes (Cut → Sew → Pack → Ship) -->
    <line x1="34"  y1="90" x2="146" y2="90" stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="34"  cy="90" r="10" fill="url(#hexAccent)"/>
    <circle cx="71"  cy="90" r="10" fill="#94A3B8"/>
    <circle cx="109" cy="90" r="10" fill="#94A3B8"/>
    <circle cx="146" cy="90" r="10" fill="url(#hexAccent)"/>

    <!-- thread arc above linking start and end -->
    <path d="M34,90 Q90,30 146,90" fill="none"
          stroke="url(#hexAccent)" stroke-width="3" stroke-linecap="round"/>
    <!-- thread arc below -->
    <path d="M34,90 Q90,150 146,90" fill="none"
          stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0F172A">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#64748B">PIPELINE&#8201;ERP</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#hexAccent)"/>
  </g>
</svg>
