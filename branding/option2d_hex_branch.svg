<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Milana ERP — hex branched">
  <title>Milana ERP — hex branched</title>
  <defs>
    <linearGradient id="h2dGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="h2dAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46" fill="url(#h2dGrad)"/>
    <polygon points="90,4 172,46 172,134 90,176 8,134 8,46"
             fill="none" stroke="#334155" stroke-width="2"/>

    <!-- main pipeline: left start → center hub → top-right end (shipment) -->
    <line x1="36"  y1="120" x2="90"  y2="90"
          stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="90"  y1="90"  x2="146" y2="60"
          stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>
    <!-- branch: branded stock production goes down-right -->
    <line x1="90"  y1="90"  x2="146" y2="130"
          stroke="#475569" stroke-width="2" stroke-dasharray="3 4"/>

    <!-- nodes -->
    <circle cx="36"  cy="120" r="9"  fill="url(#h2dAccent)"/>
    <circle cx="90"  cy="90"  r="11" fill="#ffffff"/>
    <circle cx="90"  cy="90"  r="5"  fill="url(#h2dAccent)"/>
    <circle cx="146" cy="60"  r="9"  fill="url(#h2dAccent)"/>
    <circle cx="146" cy="130" r="9"  fill="#94A3B8"/>
  </g>

  <g transform="translate(232,0)" font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="115" font-size="62" font-weight="700" letter-spacing="2" fill="#0F172A">MILANA</text>
    <text x="0" y="160" font-size="22" font-weight="500" letter-spacing="14" fill="#64748B">BRANCH&#8201;·&#8201;ERP</text>
    <rect x="0" y="128" width="240" height="3" rx="1.5" fill="url(#h2dAccent)"/>
  </g>
</svg>
