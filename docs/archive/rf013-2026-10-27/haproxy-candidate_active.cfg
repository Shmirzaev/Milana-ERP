global
    master-worker
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 10s
    timeout server 10s

frontend rf013_backend
    bind :8000
    default_backend rf013_backend_active

backend rf013_backend_active
    option httpchk GET /ready
    http-check expect status 200
    http-response set-header X-RF013-Release candidate
    http-response set-header X-RF013-Slot green
    server active milana-rf013-1_daqqfw-backend-green:10000 check inter 2s fall 3 rise 2

frontend rf013_frontend
    bind :3000
    default_backend rf013_frontend_active

backend rf013_frontend_active
    option httpchk GET /login
    http-check expect status 200
    http-response set-header X-RF013-Release candidate
    http-response set-header X-RF013-Slot green
    server active milana-rf013-1_daqqfw-frontend-green:3000 check inter 2s fall 3 rise 2
